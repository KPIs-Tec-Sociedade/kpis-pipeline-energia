# This is a Declarative Automation Bundle definition for kpis_energia.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: kpis_energia
  uuid: 86cdfcdc-b79d-4f81-b4ea-981b7bd94a77

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d99c0fec-bb58.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-empresa.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/projetosfaculdadeup@gmail.com to make sure we only have a sin gle copy.
      root_path: /Workspace/Users/projetosfaculdadeup@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: projetosfaculdadeup@gmail.com
        level: CAN_MANAGE
